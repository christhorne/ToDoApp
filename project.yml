name: ToDoApp
options:
  bundleIdPrefix: com.chris
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ToDoApp:
    type: application
    platform: iOS
    sources:
      - path: ToDoApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chris.ToDoApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: '"ToDoApp/Preview Content"'
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: ToDoApp/ToDoApp.entitlements
    dependencies:
      - target: ToDoAppWidget
        embed: true

  ToDoAppWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ToDoAppWidget
      - path: ToDoApp/Models
      - path: ToDoApp/Persistence/SharedAppGroup.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chris.ToDoApp.Widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ToDoAppWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: ToDoAppWidget/ToDoAppWidget.entitlements
        SKIP_INSTALL: YES
